name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        id: check_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # draft releases don't push an actual git tag ref until published,
          # so check via the GitHub API (includes drafts) instead of `git
          # rev-parse` against a tag name.
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install & build
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          npm ci
          npm run build

      - name: Package plugin
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          mkdir -p release/photoshop-timelapse/ffmpeg
          cp -r dist manifest.json index.html src README.md release/photoshop-timelapse/
          cp ffmpeg/README.txt release/photoshop-timelapse/ffmpeg/
          cd release && zip -r ../photoshop-timelapse-v${{ steps.version.outputs.version }}.zip photoshop-timelapse

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "photoshop-timelapse-v${{ steps.version.outputs.version }}.zip" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --draft
